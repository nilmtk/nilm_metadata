name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Install locked dependencies
        run: >-
          uv sync --frozen --python ${{ matrix.python-version }}
          --extra dev --extra hdf5

      - name: Validate lock file
        run: uv lock --check

      - name: Check onboarding and metadata index
        run: uv run python scripts/check_docs.py

      - name: Run tests
        run: uv run pytest

      - name: Build documentation without warnings
        run: >-
          uv run sphinx-build -E -W --keep-going -b html
          docs/source docs/build/html

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uv run python scripts/check_distribution.py dist
