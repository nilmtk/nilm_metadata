[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nilm_metadata"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["pandas~=2.2.0", "pyyaml"]
authors = [{ name = "Jack Kelly", email = "jack.kelly@imperial.ac.uk" }]
description = "Concatenate NILM metadata"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "smartmeters",
    "power",
    "electricity",
    "energy",
    "analytics",
    "redd",
    "disaggregation",
    "nilm",
    "nialm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
hdf5 = ["tables>=3.9"]
dev = ["furo>=2024.8.6", "pytest>=8", "sphinx>=8"]

[project.urls]
Homepage = "https://nilmtk.github.io/"
Documentation = "https://nilm-metadata.readthedocs.io/"
Repository = "https://github.com/nilmtk/nilm_metadata"
Issues = "https://github.com/nilmtk/nilm_metadata/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["nilm_metadata*"]
exclude = ["nilm_metadata.tests*"]

[tool.setuptools.package-data]
nilm_metadata = [
    "central_metadata/*.yaml",
    "central_metadata/appliance_types/*.yaml",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.1.dev0+unknown"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["nilm_metadata/tests"]
